<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عقارات الإسكندرية</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#14213d;--mut:#667085;--pri:#0b73b7;--wa:#25d366;--bd:#e4e7ec;--red:#d92d20}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--tx:#eef2f7;--mut:#98a2b3;--bd:#2b3441}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ic{flex:none}
.hb{display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:#fff;text-decoration:none;font-weight:800;padding:9px 16px;border-radius:22px;font-size:14px;white-space:nowrap}
.logo{font-weight:800;font-size:22px;color:var(--pri);cursor:pointer}
button{font:inherit;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--bd);padding:12px;border-radius:12px;align-items:center}
.filters select,.filters input[type=number]{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.tabs button{padding:9px 16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.tabs button:first-child{border-radius:0 8px 8px 0}.tabs button:last-child{border-radius:8px 0 0 8px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.chip{padding:6px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.z{opacity:.45}
details.areas{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
details.areas summary{cursor:pointer;font-weight:700}
#count{margin:14px 2px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card.off{opacity:.65}
.ph{height:170px;background:linear-gradient(135deg,#9fc5e8,#cfe2f3);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:#fffc;border:0;border-radius:50%;width:28px;height:28px;color:#000;z-index:2}
.nav.l{left:8px}.nav.r{right:8px}
.badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;padding:3px 10px;border-radius:20px;font-size:13px;z-index:2}
.vid{position:absolute;top:10px;left:10px;background:#000a;color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;z-index:2}
.allph{position:absolute;bottom:8px;left:8px;background:#000b;color:#fff;border:0;border-radius:18px;padding:6px 12px;font-size:12px;z-index:3;display:flex;align-items:center}
.allph svg{width:15px;height:15px;margin-left:5px}
.tag{position:absolute;bottom:8px;right:8px;background:#000a;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;z-index:2}
.info{padding:12px}.price{font-weight:800;font-size:18px}
.ttl{margin:4px 0;font-size:15px}.meta{color:var(--mut);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-top:10px}
.acts a{flex:1;text-align:center;text-decoration:none;color:#fff;padding:10px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.call{background:var(--pri)}.wa{background:var(--wa)}.dis{background:#98a2b3}
.pager{display:flex;gap:6px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.pager button{width:36px;height:36px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px}
.pager button.on{background:var(--pri);color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px}
/* صفحة الشقة */
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px}.crumb a{color:var(--pri);cursor:pointer}
.sticky{position:sticky;top:0;z-index:50;background:var(--bg);padding:8px 0 0;border-bottom:1px solid var(--bd)}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sbar .acts{margin:0;min-width:260px}
.sbar .p{font-weight:800;font-size:20px}.sbar .t{color:var(--mut);font-size:14px}
.dtabs{display:flex;gap:2px;overflow-x:auto;margin-top:6px}
.dtabs button{border:0;background:none;color:var(--mut);padding:8px 14px;border-bottom:3px solid transparent;white-space:nowrap}
.dtabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.pgrid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:150px 150px;gap:6px;margin:14px 0;border-radius:12px;overflow:hidden;position:relative}
.pgrid .ph{height:100%;cursor:pointer}.pgrid .ph:first-child{grid-row:span 2}
.allbtn{position:absolute;bottom:10px;right:10px;background:#fffe;color:#000;border:0;border-radius:20px;padding:6px 14px;z-index:3}
.arow{display:flex;gap:22px;margin:6px 0 14px}
.arow button{background:none;border:0;color:var(--pri);display:flex;flex-direction:column;align-items:center;font-size:13px;gap:2px}
.arow button span{font-size:20px}
sec,section{display:block;scroll-margin-top:130px}
section h3{margin:22px 0 10px}
.specs{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);margin:8px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}td{padding:11px;border-bottom:1px solid var(--bd)}td:first-child{color:var(--mut);width:40%}
.feat{display:flex;flex-wrap:wrap;gap:10px}.feat span{background:var(--card);border:1px solid var(--bd);padding:8px 14px;border-radius:8px}
.adv{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;flex-wrap:wrap}
.adv .acts{margin:0;margin-right:auto;min-width:240px}
.av{width:44px;height:44px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:22px}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:1000}
.ov.on{display:flex}
.box{background:var(--card);border-radius:18px;max-width:420px;width:100%;max-height:92vh;overflow:auto;position:relative}
.bh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd);font-weight:800;font-size:18px}
.bh button{border:0;background:none;color:var(--tx);font-size:26px;line-height:1}
.bb{padding:16px 18px 20px}
.sum{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.sum .ph{width:76px;height:76px;border-radius:10px;flex:none;font-size:28px}
.sum b{font-size:16px}.sum div div{color:var(--mut);font-size:13px;margin-top:2px}
.fld{width:100%;padding:13px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:12px}
.pw{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:12px;direction:ltr}
.pw span{padding:13px 12px;background:var(--bg);border-right:1px solid var(--bd);white-space:nowrap}
.pw input{flex:1;border:0;padding:13px;background:var(--card);color:var(--tx);font:inherit;min-width:0;outline:0;direction:ltr}
.sub{width:100%;padding:13px;border:0;border-radius:24px;background:var(--pri);color:#fff;font-weight:700}
.sub:disabled{opacity:.45;cursor:not-allowed}
.er{color:var(--red);font-size:13px;min-height:18px;margin:-4px 0 8px}
.vrow td{background:rgba(11,115,183,.14);font-weight:700}
.vlink{color:var(--pri);font-weight:800;text-decoration:none;font-size:16px}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:1000}
#lb.on{display:flex}#lbc{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:14px}#lb img{max-width:92vw;max-height:88vh}
#lb button{position:absolute;background:#fffd;border:0;border-radius:50%;width:40px;height:40px;font-size:22px}
@media(max-width:640px){.pgrid{grid-template-columns:1fr 1fr;grid-template-rows:170px 100px}.pgrid .ph:first-child{grid-column:span 2;grid-row:1}.pgrid .ph:nth-child(n+4){display:none}}
</style>
</head>

LISTINGS.forEach(l=>{ if(l.area && !AREAS.includes(l.area)) AREAS.push(l.area); });

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString("ar-EG");
const st = {type:"",furn:"",area:"",page:1};
const sl = {};
const codeOf = l => l.code || "";
const adNo = l => "EG-" + String(l.id).padStart(6,"0");
const statusLabel = l => l.status==="rented"?"تم التأجير":l.status==="sold"?"تم البيع":"";
const typeLabel = l => (l.furnished?"شقق مفروشة":"شقق") + (l.type==="rent"?" للإيجار":" للبيع");
const link = id => location.href.split("#")[0] + "#/ad/" + id;
function waLink(l,txt){
  const msg = txt || `السلام عليكم، مهتم بالعقار: ${l.title} (${l.code?"كود "+l.code:adNo(l)}) بسعر ${fmt(l.price)} ${l.unit}\n${link(l.id)}`;
  return `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
}
const SV=d=>`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-left:6px"><path d="${d}"/></svg>`;
const ICON_CALL=SV("M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z");
const ICON_IMG=SV("M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M9 9.5h.01");
const ICON_WA=SV("M7.9 20A9 9 0 1 0 4 16.1L2 22Z");
function acts(l){
  return l.status==="available"
   ? `<div class="acts"><a class="call" href="tel:+${PHONE}" onclick="callNow(event)">${ICON_CALL}اتصال</a><a class="wa" href="#" onclick="openContact(${l.id},event)">${ICON_WA}واتساب</a></div>`
   : `<div class="acts"><a class="dis">${statusLabel(l)}</a></div>`;
}
const imgTag = s => `<img src="${s}" alt="" onerror="this.remove()">`;
function slide(id,d,e){ e.stopPropagation(); const l=LISTINGS.find(x=>x.id==id), n=l.images.length; if(n<2) return;
  sl[id]=((sl[id]||0)+d+n)%n; const ph=e.target.closest(".ph"); ph.querySelector("img").src=l.images[sl[id]]; ph.querySelector(".tag").textContent=`${sl[id]+1}/${n}`; }

/* ============ قائمة الشقق ============ */
function card(l){
  return `<div class="card ${l.status!=="available"?"off":""}" onclick="location.hash='#/ad/${l.id}'">
    <div class="ph">🏢${l.images[0]?imgTag(l.images[0]):""}
      ${l.status!=="available"?`<span class="badge">${statusLabel(l)}</span>`:""}
      ${l.video?`<span class="vid">🎥 فيديو</span>`:""}
      ${l.images.length?`<button class="allph" onclick="galleryOpen(${l.id},event)">${ICON_IMG}كل الصور (${fmt(l.images.length)})</button>`:""}
      ${l.images.length>1?`<button class="nav l" onclick="slide(${l.id},-1,event)">‹</button><button class="nav r" onclick="slide(${l.id},1,event)">›</button><span class="tag">1/${l.images.length}</span>`:""}
    </div>
    <div class="info"><div class="price">${fmt(l.price)} ${l.unit}</div><div class="ttl">${l.title}</div>
     <div class="meta">${l.code?`<span>🔖 كود: ${l.code}</span>`:""}<span>📍 ${l.area}</span><span>🛏 ${l.rooms}</span><span>🛁 ${l.baths}</span>${l.size?`<span>📐 ${l.size} م²</span>`:""}<span>${l.furnished?"🛋 مفروشة":"غير مفروشة"}</span></div>
     ${acts(l)}</div></div>`;
}
function filtered(){
  const rooms=$("#rooms").value, max=+$("#max").value, all=$("#all").checked, q=$("#q").value.trim().toLowerCase();
  return LISTINGS.filter(l => (!q||(codeOf(l)+" "+adNo(l)).toLowerCase().includes(q)) && (!st.type||l.type===st.type) && (st.furn===""||String(l.furnished)===st.furn) &&
    (!st.area||l.area===st.area) && (!rooms||l.rooms==rooms) && (!max||l.price<=max) && (all||l.status==="available"));
}
function render(){
  const list=filtered(), pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(st.page>pages) st.page=1;
  const av=LISTINGS.filter(l=>l.status==="available");
  const cnt=t=>av.filter(l=>!t||l.type===t).length;
  $("#ttabs").innerHTML=[["","الكل"],["rent","للإيجار"],["sale","للبيع"]].map(([v,t])=>`<button data-v="${v}" class="${st.type===v?"on":""}">${t} (${fmt(cnt(v))})</button>`).join("");
  document.querySelectorAll("#ttabs button").forEach(b=>b.onclick=()=>{st.type=b.dataset.v;st.page=1;render()});
  const base=av.filter(l=>!st.type||l.type===st.type);
  const c=v=>base.filter(l=>String(l.furnished)===v).length;
  $("#chips").innerHTML=[["","الكل",base.length],["true","مفروشة",c("true")],["false","غير مفروشة",c("false")]]
    .map(([v,t,n])=>`<button class="chip ${st.furn===v?"on":""}" data-v="${v}">${t} (${fmt(n)})</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{st.furn=b.dataset.v;st.page=1;render()});
  $("#area").innerHTML=`<option value="">كل المناطق</option>`+AREAS.map(a=>`<option ${a===st.area?"selected":""}>${a}</option>`).join("");
  $("#achips").innerHTML=AREAS.map(a=>{const n=base.filter(l=>l.area===a).length;return `<button class="chip ${st.area===a?"on":""} ${n?"":"z"}" data-a="${a}">${a} (${fmt(n)})</button>`}).join("");
  document.querySelectorAll("#achips .chip").forEach(b=>b.onclick=()=>{st.area=st.area===b.dataset.a?"":b.dataset.a;st.page=1;render();scrollTo(0,0)});
  $("#count").textContent=`${fmt(list.length)} عقار`;
  $("#grid").innerHTML=list.length?list.slice((st.page-1)*PAGE,st.page*PAGE).map(card).join(""):`<div class="empty" style="grid-column:1/-1">مفيش نتائج بالفلاتر دي</div>`;
  $("#pager").innerHTML=pages>1?Array.from({length:pages},(_,i)=>`<button class="${i+1===st.page?"on":""}" onclick="st.page=${i+1};render();scrollTo(0,0)">${fmt(i+1)}</button>`).join(""):"";
}

/* ============ صفحة الشقة ============ */
let cur=null, lbI=0;
function related(l){
  const o=LISTINGS.filter(x=>x.id!==l.id&&x.status==="available");
  const score=x=>(x.type===l.type?4:0)+(x.furnished===l.furnished?2:0)+(x.area===l.area?1:0);
  return o.sort((a,b)=>score(b)-score(a)).slice(0,4);
}
function showAd(id){
  const l=LISTINGS.find(x=>x.id==id); if(!l){location.hash="";return}
  cur=l;
  $("#list").hidden=true; $("#detail").hidden=false; scrollTo(0,0);
  const im=l.images, tiles=im.length?im.slice(0,5).map((s,i)=>`<div class="ph" onclick="lbOpen(${i})">🏢${imgTag(s)}</div>`).join(""):`<div class="ph" style="grid-column:1/-1;grid-row:span 2">🏢</div>`;
  const rel=related(l);
  const tabs=[["s-photos","الصور"],["s-details","التفاصيل"],...(l.features&&l.features.length?[["s-feat","المزايا"]]:[])];
  $("#detail").innerHTML=`
   <div class="crumb"><a onclick="location.hash=''">عقارات الإسكندرية</a> › <a onclick="goType('${l.type}',${l.furnished})">${typeLabel(l)}</a> › <a onclick="goArea('${l.area}')">${l.area}</a></div>
   <div class="sticky"><div class="sbar">${acts(l)}<div><div class="p">${fmt(l.price)} ${l.unit}</div><div class="t">${l.title}</div></div></div>
    <div class="dtabs">${tabs.map(([i,t],k)=>`<button class="${k?"":"on"}" onclick="jump('${i}',this)">${t}</button>`).join("")}</div></div>
   <section id="s-photos"><div class="pgrid">${tiles}${im.length>5?`<button class="allbtn" onclick="lbOpen(0)">🖼 أظهر ${fmt(im.length)} صورة</button>`:""}</div></section>
   <div class="arow"><button onclick="share()"><span>↗</span>مشاركة</button><button onclick="window.open(waLink(cur,'إبلاغ عن إعلان ${adNo(l)}\\n'+link(cur.id)),'_blank')"><span>⚑</span>إبلاغ</button></div>
   <h2 style="margin:6px 0">${l.title}</h2>
   <div class="specs"><span>${typeLabel(l)} · ${l.updated}</span>${l.code?`<span>🔖 كود: <b>${l.code}</b></span>`:""}</div>
   <div class="specs"><span>📍 ${l.area}</span></div>
   <div class="specs">${l.size?`<span>📐 ${l.size} م²</span>`:""}<span>🛏 ${l.rooms} غرف</span><span>🛁 ${l.baths} حمام</span><span>✨ ${l.finishing}</span></div>
   <section id="s-details"><h3>تفاصيل الإعلان</h3>
    <table>${l.video?`<tr class="vrow"><td>🎥 الفيديو</td><td><a class="vlink" href="${l.video}" target="_blank" rel="noopener">▶ شاهد الفيديو</a></td></tr>`:""}${l.code?`<tr><td>كود الشقة</td><td>${l.code}</td></tr>`:""}<tr><td>رقم الإعلان</td><td>${adNo(l)}</td></tr><tr><td>النوع</td><td>${l.type==="rent"?"للإيجار":"للبيع"} · ${l.furnished?"مفروشة":"غير مفروشة"}</td></tr>
    <tr><td>الدور</td><td>${l.floor}</td></tr><tr><td>التشطيب</td><td>${l.finishing}</td></tr><tr><td>العنوان</td><td>${l.address}</td></tr></table>
    <h3>${l.type==="rent"?"تفاصيل الإيجار":"السعر"}</h3><table><tr><td>${l.type==="rent"?"الإيجار":"السعر"}</td><td>${fmt(l.price)} ${l.unit}</td></tr></table>
    <h3>وصف الإعلان</h3><p style="line-height:1.8">${l.desc}</p></section>
   ${l.features&&l.features.length?`<section id="s-feat"><h3>المزايا</h3><div class="feat">${l.features.map(f=>`<span>✓ ${f}</span>`).join("")}</div></section>`:""}
   <section><h3>تواصل مع المعلن</h3><div class="adv"><div class="av">👤</div><b>${ADVERTISER}</b>${acts(l)}</div></section>
   ${rel.length?`<section id="s-rel"><h3>إعلانات ذات صلة</h3><div class="grid">${rel.map(card).join("")}</div></section>`:""}`;
}
function jump(id,b){ document.querySelectorAll(".dtabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); document.getElementById(id).scrollIntoView({behavior:"smooth"}); }
function share(){ const u=link(cur.id); if(navigator.share) navigator.share({title:cur.title,url:u}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>alert("تم نسخ الرابط")); else prompt("انسخ الرابط",u); }
function goType(t,f){ st.type=t; st.furn=String(f); st.area=""; st.page=1; location.hash=""; }
function goArea(a){ st.area=a; st.type=""; st.furn=""; st.page=1; location.hash=""; }
let lbL=[];
function lbOpen(i,list){ lbL=list||cur.images; lbI=i; lbShow(); $("#lb").classList.add("on"); }
function galleryOpen(id,e){ e.stopPropagation(); const l=LISTINGS.find(x=>x.id==id); if(l&&l.images.length) lbOpen(0,l.images); }
function lbShow(){ $("#lb img").src=lbL[lbI]; $("#lbc").textContent=(lbI+1)+" / "+lbL.length; }
function lbGo(d){ lbI=(lbI+d+lbL.length)%lbL.length; lbShow(); }
function lbClose(){ $("#lb").classList.remove("on"); }


/* ============ نافذة التواصل مع المعلن (واتساب) ============ */
function normPhone(v){
  let d=v.replace(/\D/g,"");
  if(d.startsWith("0020")) d=d.slice(4); else if(d.startsWith("20")&&d.length>10) d=d.slice(2);
  if(d.startsWith("0")) d=d.slice(1);
  return /^1[0125]\d{8}$/.test(d)?d:null;
}
function fullMsg(l,name,phone){
  return [`السلام عليكم، أنا مهتم بالعقار التالي:`,``,
   ...(l.code?[`🔖 *كود الشقة: ${l.code}*`]:[]),`*${l.title}*`,`رقم الإعلان: ${adNo(l)}`,`النوع: ${typeLabel(l)}`,`المنطقة: ${l.area}`,`العنوان: ${l.address}`,
   `${l.type==="rent"?"الإيجار":"السعر"}: ${fmt(l.price)} ${l.unit}`,`الغرف: ${l.rooms}`,`الحمامات: ${l.baths}`,
   ...(l.size?[`المساحة: ${l.size} م²`]:[]),`الدور: ${l.floor}`,`التشطيب: ${l.finishing}`,
   `الوصف: ${l.desc}`,...(l.video?[`فيديو الشقة: ${l.video}`]:[]),`رابط الإعلان: ${link(l.id)}`,``,`بياناتي:`,`الاسم: ${name}`,`رقم الهاتف: +20${phone}`].join("\n");
}
let cmL=null;
function openContact(id,e){
  if(e){e.preventDefault();e.stopPropagation()}
  const l=LISTINGS.find(x=>x.id==id); if(!l) return; cmL=l;
  let sv={}; try{sv=JSON.parse(localStorage.getItem("contact")||"{}")}catch{}
  $("#cbox").innerHTML=`<div class="bh"><span>تواصل مع المعلن</span><button type="button" onclick="closeContact()">×</button></div>
   <form class="bb" onsubmit="sendContact(event)">
    <div class="sum"><div class="ph">🏢${l.images[0]?imgTag(l.images[0]):""}</div>
     <div><b>${fmt(l.price)} ${l.unit}</b><div>📍 ${l.address}</div><div>${l.title}</div></div></div>
    <h3 style="margin:0 0 6px">سجل للتواصل مع المعلن</h3>
    <p style="color:var(--mut);margin:0 0 14px">بيتم إرسال بياناتك وتفاصيل العقار للمعلن على واتساب.</p>
    <input class="fld" id="cn" placeholder="الاسم" autocomplete="name" value="${(sv.name||"").replace(/"/g,"&quot;")}">
    <div class="pw"><span>🇪🇬 +20</span><input id="cp" type="tel" inputmode="numeric" placeholder="011****" autocomplete="tel" value="${sv.phone||""}"></div>
    <div class="er" id="ce"></div>
    <button class="sub" id="cs" type="submit">تأكيد</button></form>`;
  $("#cn").oninput=$("#cp").oninput=chk; chk();
  $("#cm").classList.add("on");
}
function chk(){ const ok=$("#cn").value.trim().length>=2 && normPhone($("#cp").value); $("#cs").disabled=!ok; $("#ce").textContent=$("#cp").value&&!normPhone($("#cp").value)?"اكتب رقم موبايل مصري صحيح":""; }
function sendContact(e){
  e.preventDefault();
  const name=$("#cn").value.trim(), ph=normPhone($("#cp").value); if(!name||!ph) return;
  try{localStorage.setItem("contact",JSON.stringify({name,phone:$("#cp").value}))}catch{}
  const msg=fullMsg(cmL,name,ph), url=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
  let w=null; try{ w=window.open(url,"_blank"); }catch{}
  if(w) { closeContact(); return; }
  /* المتصفح منع فتح النافذة: نعرض رابط يدوي ونسخ الرسالة */
  window.__msg=msg;
  $("#cbox").innerHTML=`<div class="bh"><span>تم تجهيز رسالتك</span><button type="button" onclick="closeContact()">×</button></div>
   <div class="bb"><p style="margin:0 0 14px">دوس على الزرار لفتح واتساب، وابعت الرسالة.</p>
    <a class="sub" style="display:block;text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">${ICON_WA}فتح واتساب</a>
    <button class="sub" type="button" style="background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:10px" onclick="copyTxt(window.__msg,this)">نسخ الرسالة</button>
    <p style="color:var(--mut);font-size:13px;margin:14px 0 0">أو ابعتها يدويًا على رقم: <b dir="ltr">+20 12 11853834</b></p></div>`;
}
function copyTxt(t,btn){ const ok=()=>{btn.textContent="تم النسخ ✓"}; if(navigator.clipboard) navigator.clipboard.writeText(t).then(ok,()=>prompt("انسخ:",t)); else prompt("انسخ:",t); }
function callNow(e){
  e.stopPropagation();
  if(/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) return;   /* الموبايل: يتصل مباشرة */
  e.preventDefault();
  $("#cbox").innerHTML=`<div class="bh"><span>اتصل بنا</span><button type="button" onclick="closeContact()">×</button></div>
   <div class="bb" style="text-align:center"><p style="margin:0 0 8px;color:var(--mut)">اتصل على الرقم ده من موبايلك:</p>
    <div dir="ltr" style="font-size:28px;font-weight:800;margin:6px 0 16px">+20 12 11853834</div>
    <button class="sub" type="button" onclick="copyTxt('+201211853834',this)">نسخ الرقم</button>
    <a href="tel:+${PHONE}" style="display:block;margin-top:12px;color:var(--pri)">فتح تطبيق الاتصال</a></div>`;
  $("#cm").classList.add("on");
}
function closeContact(){ $("#cm").classList.remove("on"); }
$("#cm").addEventListener("click",e=>{ if(e.target.id==="cm") closeContact(); });


/* ============ شقة خصيصًا ليك (خدمة العملاء على واتساب) ============ */
function special(e){
  e.preventDefault();
  const want=[st.type==="rent"?"إيجار":st.type==="sale"?"بيع":"",st.furn==="true"?"مفروشة":st.furn==="false"?"غير مفروشة":"",st.area?"في "+st.area:""].filter(Boolean).join(" ");
  const msg=`السلام عليكم، مش لاقي شقة مناسبة وعايز شقة خصيصًا ليا.${want?"\nالمطلوب: "+want:""}\nممكن تساعدوني؟`;
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`,"_blank");
}

$("#lb").addEventListener("click",e=>{ if(e.target.id==="lb") lbClose(); });
addEventListener("keydown",e=>{ if(!$("#lb").classList.contains("on")) return; if(e.key==="Escape") lbClose(); if(e.key==="ArrowLeft") lbGo(-1); if(e.key==="ArrowRight") lbGo(1); });

/* ============ التنقل والتشغيل ============ */
function route(){
  const m=location.hash.match(/^#\/ad\/(\d+)/);
  if(m) showAd(+m[1]);
  else { $("#detail").hidden=true; $("#list").hidden=false; render(); }
}
["rooms","max","all","q"].forEach(i=>$("#"+i).addEventListener("input",()=>{st.page=1;render()}));
$("#area").addEventListener("input",e=>{st.area=e.target.value;st.page=1;render()});
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
